<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!--
    Hello, view-source reader! This is a hand-built reading tracker:
    plain HTML, hand-written CSS and a little vanilla JavaScript, with no
    framework and no build step. The books themselves live in a Markdown
    file, books.md, which the app reads and writes through the GitHub API.
  -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elliot&#x2019;s bookshelf — Archive</title>
  <meta name="description" content="What Elliot Jay Stocks is reading, has read, and plans to read next.">
  <meta name="theme-color" content="#F6F6F6">

  <meta name="robots" content="noai, noimageai">
  <meta name="CCBot" content="nofollow">
  <meta name="tdm-reservation" content="1">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Elliot&#8217;s bookshelf">
  <meta property="og:description" content="What Elliot Jay Stocks is reading, has read, and plans to read next.">
  <meta name="twitter:card" content="summary">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="site-nav" aria-label="Main navigation">
    <a href="index.html" class="nav-brand" aria-label="Elliot&#x2019;s bookshelf home">Elliot&#x2019;s bookshelf</a>
    <ul class="nav-links" role="list">
      <li><a href="index.html">Reading</a></li>
      <li><a href="to-read.html">To Read</a></li>
      <li><a href="archive.html" aria-current="page">Archive</a></li>
    </ul>
    <div class="nav-actions">
      <button class="nav-icon-btn" id="btn-search" aria-label="Search for a book" data-owner-only></button>
      <button class="nav-icon-btn" id="btn-settings" aria-label="Settings"></button>
    </div>
    <button class="nav-hamburger" id="btn-menu" aria-label="Open menu" aria-expanded="false"></button>
  </nav>

  <main class="page">
    <div class="container">

      <header class="page-header">
        <div class="page-header-left">
          <h1 class="page-title">Archive</h1>
        </div>
      </header>

      <div class="tabs" id="tab-row" role="tablist" aria-label="Archive sub-lists"></div>

      <div id="panel-finished"  class="tab-panel" role="tabpanel" aria-live="polite"></div>
      <div id="panel-abandoned" class="tab-panel" role="tabpanel" aria-live="polite"></div>

    </div>
  </main>

  <div class="page-loading" id="page-loading" aria-hidden="true">
    <div class="spinner"></div>
  </div>

  <div id="modal-root" aria-live="assertive"></div>
  <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script src="js/app.js"></script>
  <script>document.addEventListener('DOMContentLoaded', function () { Bookshelf.initArchive(); });</script>
</body>
</html>
